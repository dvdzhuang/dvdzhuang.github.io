    <link id="theme" rel="stylesheet" href="/themes/default.css">
    <script>
        let root = document.querySelector(':root');
        let col = 0;
        let themes = {
            'default': ['aquamarine', 'lightsteelblue', 'plum', 'pink', 'lightcoral', 'lightsalmon', 'bisque', 'palegreen'],
            'amogus': ['#d71e22']
        };
        let theme = 'default';
        function setColor() {
            col = (col + 1) % themes[theme].length;
            let newColor = themes[theme][col]
            root.style.setProperty('--hovercolor', newColor);
            window.parent.document.documentElement.style.setProperty('--hovercolor', newColor);
        }
        function changeTheme(newTheme) {
            theme = (theme === newTheme) ? 'default' : newTheme;
            localStorage.setItem('theme', theme);
            let file = '/themes/' + theme + '.css';
            col = -1;
            setColor();
            document.getElementById('theme').setAttribute('href', file);
            window.parent.document.getElementById('theme').setAttribute('href', file);
        }
    </script>
