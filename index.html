<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>David Zhuang</title>
    <link rel="stylesheet" href="/styles.css">
    <link id="theme" rel="stylesheet" href="/themes/default.css">
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DWLTJPTK6X"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-DWLTJPTK6X');

        function changeTheme(newTheme) {
            theme = (theme === newTheme) ? 'default' : newTheme;
            let file = '/themes/' + theme + '.css';
            document.getElementById('theme').setAttribute('href', file);
            frames['info-window'].document.getElementById('theme').setAttribute('href', file);
        }
        let aspectRatio = window.matchMedia('(aspect-ratio <= 4/3)');
        function handleAspectRatioChange(e) {
            if (e.matches) {
                document.documentElement.style.setProperty('--isVertical', 1);
                frames['info-window'].document.documentElement.style.setProperty('--isVertical', 1);
            } else {
                document.documentElement.style.setProperty('--isVertical', 0);
                frames['info-window'].document.documentElement.style.setProperty('--isVertical', 0);
            }
        }
        aspectRatio.addEventListener('change', handleAspectRatioChange);
        function updateIFrame() {
            let iframe = frames['info-window'].document;
            iframe.documentElement.style.setProperty('--hovercolor', document.documentElement.style.getPropertyValue('--hovercolor'));
            iframe.getElementById('theme').setAttribute('href', document.getElementById('theme').getAttribute('href'));
            handleAspectRatioChange(aspectRatio);
        }
    </script>
</head>

<body>
    <div class="info">
        <div class="categories-grid">
            <a href="about.html" target="info-window">about</a>
            <a href="experience.html" target="info-window">experience</a>
            <a href="projects.html" target="info-window">projects</a>
            <a href="achievements.html" target="info-window">achievements</a>
        </div>
        <iframe src="about.html" name="info-window" id="info-window" onload="updateIFrame()"></iframe>
    </div>

    <script>
        window.onload = function () {
            const newTheme = localStorage.getItem('theme');
            if (newTheme)
                changeTheme(newTheme);
        };
    </script>
</body>

</html>
